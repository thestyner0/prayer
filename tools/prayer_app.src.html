<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161d47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>주일기도모임 · 아침기도</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#161d47;--panel:#233166;--panel2:#2c3c7a;--line:#3a4a8f;--body:#f1f4fb;--muted:#a8b6e0;--dim:#7c8ac0;--ac:#9BD0E8;--gold:#D8A94A;--danger:#f08a8a}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--body);min-height:100vh;line-height:1.5;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
 padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{padding:18px 0 8px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
header .hl{flex:1;min-width:200px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ac);margin-bottom:5px}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.datetag{font-size:12px;color:var(--dim);margin-top:4px}
.thisweek{display:inline-block;margin-top:9px;background:var(--ac);color:#12193c;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
.tools{display:flex;gap:6px;align-items:center;padding-top:6px}
.tb{font:inherit;font-size:12.5px;font-weight:700;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.tb.on{background:var(--gold);border-color:var(--gold);color:#241a05}
.tb:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.status{font-size:11px;color:var(--dim);padding:6px 4px;max-width:46vw;text-align:right}
.banner{display:none;margin:10px 0 0;padding:12px 14px;border:1px solid var(--danger);border-radius:12px;background:var(--panel);font-size:13px;line-height:1.6}
.banner.on{display:block}
.banner code{font-size:12px;word-break:break-all}
.status.busy{color:var(--gold)} .status.err{color:var(--danger)}
nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;white-space:nowrap;text-decoration:none;display:block;cursor:pointer}
.tab .n{font-weight:800;margin-right:3px}
.tab.on{background:var(--ac);border-color:var(--ac);color:#12193c}
.tab.order{border-color:#5b6bb0;color:#cdd8f5}.tab.order.on{background:#5b6bb0;border-color:#5b6bb0;color:#fff}
.tab.every{border-color:var(--gold);color:#F2D18A}.tab.every.on{background:var(--gold);border-color:var(--gold);color:#241a05}
.tab .ev{font-size:9.5px;font-weight:800;letter-spacing:.06em;margin-left:5px;background:rgba(216,169,74,.22);color:#F2D18A;border-radius:99px;padding:2px 6px;vertical-align:1px}
.tab.every.on .ev{background:rgba(0,0,0,.16);color:#241a05}
.dayhead{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:14px 0}
.dayhead .t{font-size:19px;font-weight:800;letter-spacing:-.02em}
.dayhead .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.dayhead .meta{font-size:11px;color:var(--dim);margin-top:6px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.sec summary{display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;list-style:none;flex-wrap:wrap}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin:-4px 2px 0 auto;flex:0 0 auto}
.sec[open] summary::after{transform:rotate(-135deg);margin-top:2px}
.sec .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ac);width:100%}
.sec .t{font-size:15.5px;font-weight:700}
.sec .cnt{font-size:11px;color:var(--dim)}
.secbody{padding:0 12px 10px}
.sub{font-size:12px;color:var(--muted);padding:0 2px 10px}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:9px;padding:11px 12px;margin-bottom:6px;position:relative}
.it .no{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--ac);color:#12193c;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.it .tx{font-size:15px;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.it .dsc{display:block;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.09)}
.it .dsc i{display:block;font-size:12.5px;font-style:normal;color:var(--muted);line-height:1.5;padding-left:9px;position:relative;margin-top:3px}
.it .dsc i:before{content:"·";position:absolute;left:0;color:var(--ac)}
.guide{font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border-left:2px solid var(--ac);padding:9px 11px;margin:2px 0 4px}
.guide b{color:var(--ac);font-weight:700}
.st{display:flex;gap:9px;align-items:flex-start;background:var(--panel2);border-radius:9px;padding:9px 11px;margin-bottom:5px}
.st .n{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.12);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.st .tx{font-size:14px;flex:1}
.st .tx b{color:#F2D18A;font-weight:800}
.cc{background:rgba(255,255,255,.06);border-radius:9px;padding:11px 12px;margin:6px 0 0}
.cc .h{font-size:14px;font-weight:700;margin-bottom:3px}
.cc .r{font-size:11.5px;font-weight:700;color:var(--gold);margin-bottom:4px}
.cc .d{font-size:12.5px;color:var(--muted)}
.onote{font-size:11.5px;color:var(--dim);padding:8px 2px 0}
.foot{text-align:center;font-size:11px;color:var(--dim);padding:22px 0 8px;line-height:1.7}
/* ---- 편집 ---- */
.edit-only{display:none}
body.editing .edit-only{display:inline-flex}
body.editing .it,body.editing .st,body.editing .cc,body.editing .dayhead,body.editing .sec summary .t{cursor:text}
.ctl{display:inline-flex;gap:4px;flex:0 0 auto;margin-left:6px}
.mini{font:inherit;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:3px 7px;cursor:pointer;line-height:1.2}
.mini.del{color:var(--danger)}
.mini:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.addrow{display:none;margin:4px 0 2px}
body.editing .addrow{display:flex;gap:6px;flex-wrap:wrap}
.add{font:inherit;font-size:12.5px;font-weight:700;background:transparent;border:1.5px dashed var(--line);color:var(--muted);border-radius:9px;padding:8px 12px;cursor:pointer;flex:1;text-align:left}
.add:hover{border-color:var(--ac);color:var(--ac)}
.ed{background:#1b2558;border:1px solid var(--ac);border-radius:9px;padding:10px;margin-bottom:6px}
.ed label{display:block;font-size:11px;color:var(--ac);font-weight:700;letter-spacing:.06em;margin:6px 0 3px}
.ed input,.ed textarea{width:100%;font:inherit;font-size:14.5px;color:var(--body);background:#12193c;border:1px solid var(--line);border-radius:7px;padding:8px 10px;line-height:1.5}
.ed textarea{min-height:96px;resize:vertical}
.ed input:focus,.ed textarea:focus{outline:none;border-color:var(--ac)}
.ed .hint{font-size:11px;color:var(--dim);margin-top:4px}
.ed .btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.p{background:var(--ac);color:#12193c}.btn.g{background:var(--panel2);color:var(--muted)}.btn.d{background:transparent;color:var(--danger);border:1px solid rgba(240,138,138,.4)}
.day{display:none}.day.on{display:block}
.settings{background:var(--panel);border:1px solid var(--gold);border-radius:13px;padding:14px;margin:8px 0 14px;display:none}
.settings.on{display:block}
.settings h3{font-size:13px;color:var(--gold);margin-bottom:6px}
.settings .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settings label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.settings input{width:100%;font:inherit;font-size:14px;color:var(--body);background:#12193c;border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.settings p{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
@media (max-width:480px){.settings .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hl">
    <div class="eyebrow">주일기도모임 · 아침기도</div>
    <h1>기도제목 대시보드</h1>
    <div class="datetag" id="datetag"></div>
    <div class="thisweek" id="weektag"></div>
  </div>
  <div class="tools">
    <span class="status" id="status"></span>
    <button class="tb" id="editBtn" type="button">✎ 편집</button>
    <button class="tb" id="setBtn" type="button">⚙</button>
  </div>
</header>
<div class="banner" id="banner"></div>
<div class="settings" id="settings">
  <h3>순환 · 시편 설정</h3>
  <div class="grid">
    <div><label>기준 월요일 (이 주에)</label><input id="s_am" type="date"></div>
    <div><label>이 주차를 기도 (1~6)</label><input id="s_aw" type="number" min="1" max="6"></div>
    <div><label>시편 기준 월요일</label><input id="s_pm" type="date"></div>
    <div><label>그 주 시편 편수</label><input id="s_ps" type="number" min="1" max="150"></div>
  </div>
  <p>1~6주차는 매주 월요일 다음 주차로 넘어가고, 긴급·중보는 매주 함께 기도합니다. 시편은 기준 주에서 매주 1편씩 올라갑니다.</p>
  <div class="ed" style="margin:8px 0 0;border-color:var(--line)"><div class="btns"><button class="btn p" id="s_save" type="button">저장</button><button class="btn g" id="s_close" type="button">닫기</button></div></div>
</div>
<nav id="tabs"></nav>
<main id="main"></main>
<div class="foot">매주 월요일에 다음 주차로 자동으로 넘어갑니다 · 긴급 · 중보기도는 매주 함께합니다<br><span id="foot2"></span></div>
</div>

<script id="seed" type="application/json">__SEED__</script>
<script>
(function(){
"use strict";
var CYCLE=6, WD=["일","월","화","수","목","금","토"];
var STATE=JSON.parse(document.getElementById("seed").textContent);
var DB=null, EDIT=false, SEL=null, DIRTY={}, saveTimer=null, editingKey=null, MODE="viewer";

/* ---------- 날짜 계산 ---------- */
function mon(x){var t=new Date(x);t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+6)%7));return t;}
function weeksBetween(a,b){return Math.round((mon(a)-mon(b))/6048e5);}
function todayWeek(){var wk=weeksBetween(new Date(),new Date(STATE.anchorMonday+"T00:00:00"));return ((STATE.anchorWeek-1+((wk%CYCLE)+CYCLE)%CYCLE)%CYCLE)+1;}
function psalmNow(){var p=STATE.meeting.psalm;return p.start+weeksBetween(new Date(),new Date(p.anchorMonday+"T00:00:00"));}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function dayByNo(n){for(var i=0;i<STATE.days.length;i++) if(STATE.days[i].no===n) return STATE.days[i]; return null;}

/* ---------- 렌더 ---------- */
function renderHeader(){
  var now=new Date(), tw=todayWeek(), d=dayByNo(tw);
  document.getElementById("datetag").textContent=now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 "+WD[now.getDay()]+"요일 · 기도제목 업데이트 "+(STATE.updated||"");
  document.getElementById("weektag").textContent="이번 주 · "+tw+"주차 · "+(d?d.title:"");
  document.getElementById("foot2").textContent=MODE==="editor"?"편집 내용은 저장 즉시 모든 기기에 반영됩니다":"";
}
function renderTabs(){
  var tw=todayWeek(), h='<a class="tab order'+(SEL===0?" on":"")+'" data-day="0">기도모임 순서</a>';
  STATE.days.forEach(function(d){
    if(d.no<=CYCLE) h+='<a class="tab'+(SEL===d.no?" on":"")+'" data-day="'+d.no+'"><span class="n">'+d.no+'</span>주차</a>';
    else h+='<a class="tab every'+(SEL===d.no?" on":"")+'" data-day="'+d.no+'">긴급 · 중보<span class="ev">매주</span></a>';
  });
  document.getElementById("tabs").innerHTML=h;
}
function ctl(kind,idx){ // 편집 컨트롤
  return '<span class="ctl edit-only" data-ctl="'+kind+'" data-i="'+idx+'">'
   +'<button class="mini" type="button" data-act="up" title="위로">↑</button>'
   +'<button class="mini" type="button" data-act="down" title="아래로">↓</button>'
   +'<button class="mini del" type="button" data-act="del" title="삭제">✕</button></span>';
}
function itemHTML(it,ii,si){
  var dd=it.d||[];
  return '<div class="it" data-i="'+ii+'" data-s="'+si+'"><span class="no">'+(ii+1)+'</span>'
   +'<span class="tx">'+esc(it.t)+(dd.length?'<span class="dsc">'+dd.map(function(x){return '<i>'+esc(x)+'</i>';}).join("")+'</span>':'')+'</span>'
   +ctl("item",ii)+'</div>';
}
function sectionHTML(s,si){
  var items=s.items.map(function(it,ii){return itemHTML(it,ii,si);}).join("");
  return '<details class="sec" open data-s="'+si+'"><summary>'+(s.kicker?'<span class="k">'+esc(s.kicker)+'</span>':'')
   +'<span class="t" data-edit="sec">'+esc(s.title)+'</span><span class="cnt">'+s.items.length+'</span>'+ctl("sec",si)+'</summary>'
   +'<div class="secbody">'+(s.sub?'<div class="sub">'+esc(s.sub)+'</div>':'')+items
   +'<div class="addrow"><button class="add" type="button" data-act="additem" data-s="'+si+'">+ 기도제목 추가</button></div>'
   +(s.guide?'<div class="guide"><b>인도</b>&nbsp; '+esc(s.guide)+'</div>':'')+'</div></details>';
}
function orderHTML(){
  var m=STATE.meeting, cp=STATE.commonPrayer;
  var steps=m.steps.map(function(s,i){
    var isP=/말씀묵상/.test(s), isC=/공통기도/.test(s);
    return '<div class="st" data-step="'+i+'"><span class="n">'+(i+1)+'</span><span class="tx" data-edit="step">'+esc(s)
      +(isP?' <b>시편 '+psalmNow()+'편</b>':'')
      +(isC?cp.cards.map(function(c,ci){return '<div class="cc" data-card="'+ci+'"><div class="h">'+esc(c.t)+'</div>'+(c.ref?'<div class="r">'+esc(c.ref)+'</div>':'')+'<div class="d">'+esc(c.d)+'</div>'+ctl("card",ci)+'</div>';}).join("")
        +'<div class="addrow"><button class="add" type="button" data-act="addcard">+ 공통기도 카드 추가</button></div>':'')
      +'</span>'+ctl("step",i)+'</div>';
  }).join("");
  return '<section class="day on" data-day="0"><div class="dayhead"><div class="t">기도모임 순서</div><div class="s">모이면 이 순서로 기도합니다</div></div>'
   +steps+'<div class="addrow"><button class="add" type="button" data-act="addstep">+ 순서 항목 추가</button></div>'
   +'<div class="onote" data-edit="note">'+esc(m.note||"")+'</div></section>';
}
function dayHTML(d){
  var total=0; d.sections.forEach(function(s){total+=s.items.length;});
  var secs=d.sections.map(sectionHTML).join("");
  return '<section class="day on" data-day="'+d.no+'"><div class="dayhead" data-edit="day"><div class="t">'+(d.no<=CYCLE?d.no+"주차 · ":"")+esc(d.title)+'</div>'
   +'<div class="s">'+esc(d.sub||"")+'</div><div class="meta">'+d.sections.length+'개 주제 · 기도제목 '+total+'개</div></div>'
   +secs+'<div class="addrow"><button class="add" type="button" data-act="addsec">+ 주제(섹션) 추가</button><button class="add" type="button" data-act="renum" style="flex:0 0 auto">번호 다시 매기기</button></div></section>';
}
function render(){
  renderHeader(); renderTabs();
  var main=document.getElementById("main");
  if(SEL===0) main.innerHTML=orderHTML();
  else { var d=dayByNo(SEL); main.innerHTML=d?dayHTML(d):""; }
  document.documentElement.style.setProperty("--ac", SEL===0?"#D8A94A":(dayByNo(SEL)||{}).accent||"#9BD0E8");
  window.scrollTo({top:0});
}
function show(n){ SEL=n; editingKey=null; try{history.replaceState(null,"","#day"+n);}catch(e){} render(); }

/* ---------- 편집 ---------- */
function markDirty(dayNo){ DIRTY[dayNo==null?"meta":String(dayNo)]=true; scheduleSave(); }
function setStatus(t,cls){ var s=document.getElementById("status"); s.textContent=t; s.className="status "+(cls||""); }
function scheduleSave(){ setStatus("저장 대기…","busy"); clearTimeout(saveTimer); saveTimer=setTimeout(save,1200); }
async function save(){
  if(!DB){ setStatus("저장 불가 (오프라인 보기)","err"); return; }
  setStatus("저장 중…","busy");
  STATE.updatedAt=new Date().toISOString(); STATE.rev=(STATE.rev||0)+1;
  var now=new Date(); STATE.updated=now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일";
  var keys=Object.keys(DIRTY); DIRTY={};
  try{
    for(var i=0;i<keys.length;i++){
      var k=keys[i];
      if(k==="meta") await DB.doc("prayer/meta").set(metaDoc());
      else { var d=dayByNo(+k); if(d) await DB.doc("prayer/meta/days/"+k).set(d); }
    }
    if(keys.indexOf("meta")<0) await DB.doc("prayer/meta").update({rev:STATE.rev,updated:STATE.updated,updatedAt:STATE.updatedAt});
    setStatus("저장됨 · "+now.getHours()+":"+String(now.getMinutes()).padStart(2,"0"),"");
    renderHeader();
  }catch(e){ setStatus("저장 실패("+((e&&(e.code||e.message))||"?")+") — 다시 시도합니다","err"); keys.forEach(function(k){DIRTY[k]=true;}); setTimeout(save,3000); }
}
function metaDoc(){ return {rev:STATE.rev,updated:STATE.updated,updatedAt:STATE.updatedAt,anchorMonday:STATE.anchorMonday,anchorWeek:STATE.anchorWeek,meeting:STATE.meeting,commonPrayer:STATE.commonPrayer,dayIndex:STATE.days.map(function(d){return {no:d.no,title:d.title,sub:d.sub||"",accent:d.accent};})}; }

function editorBox(fields, onSave, onDelete){ // fields: [{k,label,val,multi,hint}]
  var h='<div class="ed">'+fields.map(function(f){return '<label>'+f.label+'</label>'+(f.multi?'<textarea data-k="'+f.k+'">'+esc(f.val)+'</textarea>':'<input data-k="'+f.k+'" value="'+esc(f.val)+'">')+(f.hint?'<div class="hint">'+f.hint+'</div>':'');}).join("")
   +'<div class="btns"><button class="btn p" data-act="ok" type="button">저장</button><button class="btn g" data-act="cancel" type="button">취소</button>'+(onDelete?'<button class="btn d" data-act="del" type="button">삭제</button>':'')+'</div></div>';
  var el=document.createElement("div"); el.innerHTML=h; el=el.firstChild;
  var armed=false;
  el.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return; e.stopPropagation();
    if(b.dataset.act==="cancel"){ editingKey=null; render(); }
    else if(b.dataset.act==="ok"){ var v={}; el.querySelectorAll("[data-k]").forEach(function(x){v[x.dataset.k]=x.value;}); editingKey=null; onSave(v); }
    else if(b.dataset.act==="del"){ if(!armed){armed=true; b.textContent="정말 삭제"; return;} editingKey=null; onDelete(); }
  });
  el.addEventListener("keydown",function(e){ if(e.key==="Escape"){editingKey=null;render();} });
  return el;
}
function openItemEditor(si,ii){
  var d=dayByNo(SEL), s=d.sections[si], it=s.items[ii], node=document.querySelector('.it[data-s="'+si+'"][data-i="'+ii+'"]');
  var box=editorBox([{k:"txt",label:"기도제목 (첫 줄) · 종속 내용 (둘째 줄부터)",val:[it.t].concat(it.d||[]).join("\n"),multi:true,hint:"첫 줄이 기도제목, 아래 줄들은 그 제목에 딸린 내용으로 들여쓰기됩니다."}],
    function(v){ var L=v.txt.split("\n").map(function(x){return x.trim();}).filter(Boolean); if(!L.length){render();return;} it.t=L[0]; it.d=L.slice(1); markDirty(d.no); render(); },
    function(){ s.items.splice(ii,1); markDirty(d.no); render(); });
  node.replaceWith(box); box.querySelector("textarea").focus();
}
function openSectionEditor(si){
  var d=dayByNo(SEL), s=d.sections[si], node=document.querySelector('.sec[data-s="'+si+'"]');
  var box=editorBox([{k:"kicker",label:"작은 제목 (예: 1주차 · 01 | 말씀)",val:s.kicker||""},{k:"title",label:"주제 제목",val:s.title},{k:"sub",label:"부제",val:s.sub||""},{k:"guide",label:"인도 메모",val:s.guide||"",multi:true}],
    function(v){ s.kicker=v.kicker.trim(); s.title=v.title.trim()||s.title; s.sub=v.sub.trim(); s.guide=v.guide.trim(); markDirty(d.no); render(); },
    function(){ d.sections.splice(si,1); markDirty(d.no); render(); });
  node.replaceWith(box); box.querySelector("input[data-k=title]").focus();
}
function openDayEditor(){
  var d=dayByNo(SEL), node=document.querySelector(".dayhead");
  var box=editorBox([{k:"title",label:"주차 제목",val:d.title},{k:"sub",label:"부제",val:d.sub||""}],
    function(v){ d.title=v.title.trim()||d.title; d.sub=v.sub.trim(); markDirty(d.no); markDirty(null); render(); });
  node.replaceWith(box);
}
function openStepEditor(i){
  var node=document.querySelector('.st[data-step="'+i+'"]');
  var box=editorBox([{k:"s",label:"순서 항목",val:STATE.meeting.steps[i],hint:"'말씀묵상'이 들어가면 그 주 시편 편수가, '공통기도'가 들어가면 공통기도 카드가 자동으로 붙습니다."}],
    function(v){ STATE.meeting.steps[i]=v.s.trim()||STATE.meeting.steps[i]; markDirty(null); render(); },
    function(){ STATE.meeting.steps.splice(i,1); markDirty(null); render(); });
  node.replaceWith(box);
}
function openCardEditor(ci){
  var c=STATE.commonPrayer.cards[ci], node=document.querySelector('.cc[data-card="'+ci+'"]');
  var box=editorBox([{k:"t",label:"제목",val:c.t},{k:"ref",label:"본문",val:c.ref||""},{k:"d",label:"설명",val:c.d||"",multi:true}],
    function(v){ c.t=v.t.trim()||c.t; c.ref=v.ref.trim(); c.d=v.d.trim(); markDirty(null); render(); },
    function(){ STATE.commonPrayer.cards.splice(ci,1); markDirty(null); render(); });
  node.replaceWith(box);
}
function openNoteEditor(){
  var node=document.querySelector('[data-edit="note"]');
  var box=editorBox([{k:"n",label:"순서 아래 메모",val:STATE.meeting.note||"",multi:true}], function(v){ STATE.meeting.note=v.n.trim(); markDirty(null); render(); });
  node.replaceWith(box);
}
function move(arr,i,dir){ var j=i+dir; if(j<0||j>=arr.length) return false; var t=arr[i]; arr[i]=arr[j]; arr[j]=t; return true; }
function renumber(d){
  var label=d.no<=CYCLE?d.no+"주차":"긴급·중보";
  d.sections.forEach(function(s,i){
    var k=s.kicker||"", cat=(k.split("|")[1]||"").trim(), pre=(k.split("·")[0]||"").trim();
    if(!pre||/주차|일차|긴급/.test(pre)) pre=label;
    s.kicker=pre+" · "+String(i+1).padStart(2,"0")+(cat?" | "+cat:"");
  });
}

document.getElementById("main").addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]"), t=e.target;
  if(b){
    e.preventDefault(); e.stopPropagation();
    var act=b.dataset.act, wrapC=b.closest("[data-ctl]"), d=dayByNo(SEL);
    if(act==="additem"){ var s=d.sections[+b.dataset.s]; s.items.push({t:"",d:[]}); render(); openItemEditor(+b.dataset.s,s.items.length-1); return; }
    if(act==="addsec"){ d.sections.push({kicker:"",title:"새 주제",sub:"",items:[],guide:""}); renumber(d); markDirty(d.no); render(); openSectionEditor(d.sections.length-1); return; }
    if(act==="renum"){ renumber(d); markDirty(d.no); render(); return; }
    if(act==="addstep"){ STATE.meeting.steps.push("새 순서"); markDirty(null); render(); openStepEditor(STATE.meeting.steps.length-1); return; }
    if(act==="addcard"){ STATE.commonPrayer.cards.push({t:"새 카드",ref:"",d:""}); markDirty(null); render(); openCardEditor(STATE.commonPrayer.cards.length-1); return; }
    if(wrapC){
      var kind=wrapC.dataset.ctl, i=+wrapC.dataset.i, dir=act==="up"?-1:1;
      if(kind==="item"){ var si=+wrapC.closest(".it").dataset.s, arr=d.sections[si].items; if(act==="del"){ openItemEditor(si,i); return; } if(move(arr,i,dir)){markDirty(d.no);render();} }
      else if(kind==="sec"){ if(act==="del"){ openSectionEditor(i); return; } if(move(d.sections,i,dir)){renumber(d);markDirty(d.no);render();} }
      else if(kind==="step"){ if(act==="del"){ openStepEditor(i); return; } if(move(STATE.meeting.steps,i,dir)){markDirty(null);render();} }
      else if(kind==="card"){ if(act==="del"){ openCardEditor(i); return; } if(move(STATE.commonPrayer.cards,i,dir)){markDirty(null);render();} }
    }
    return;
  }
  if(!EDIT) return;
  if(t.closest(".ed")) return;
  var it=t.closest(".it"); if(it){ e.preventDefault(); openItemEditor(+it.dataset.s,+it.dataset.i); return; }
  var st=t.closest(".cc"); if(st){ e.preventDefault(); openCardEditor(+st.dataset.card); return; }
  var sp=t.closest(".st"); if(sp){ e.preventDefault(); openStepEditor(+sp.dataset.step); return; }
  if(t.closest('[data-edit="sec"]')){ e.preventDefault(); openSectionEditor(+t.closest(".sec").dataset.s); return; }
  if(t.closest('[data-edit="day"]')){ e.preventDefault(); openDayEditor(); return; }
  if(t.closest('[data-edit="note"]')){ e.preventDefault(); openNoteEditor(); return; }
});
document.getElementById("tabs").addEventListener("click",function(e){ var a=e.target.closest(".tab"); if(a){ e.preventDefault(); show(+a.dataset.day); } });
document.getElementById("editBtn").addEventListener("click",function(){ if(!DB){ showBanner(); return; } EDIT=!EDIT; document.body.classList.toggle("editing",EDIT); this.classList.toggle("on",EDIT); this.textContent=EDIT?"✓ 편집 끝":"✎ 편집"; render(); });
var setBox=document.getElementById("settings");
document.getElementById("setBtn").addEventListener("click",function(){
  if(!DB){ showBanner(); return; }
  setBox.classList.toggle("on");
  document.getElementById("s_am").value=STATE.anchorMonday; document.getElementById("s_aw").value=STATE.anchorWeek;
  document.getElementById("s_pm").value=STATE.meeting.psalm.anchorMonday; document.getElementById("s_ps").value=STATE.meeting.psalm.start;
});
document.getElementById("s_close").addEventListener("click",function(){ setBox.classList.remove("on"); });
document.getElementById("s_save").addEventListener("click",function(){
  var am=document.getElementById("s_am").value, aw=+document.getElementById("s_aw").value, pm=document.getElementById("s_pm").value, ps=+document.getElementById("s_ps").value;
  if(am) STATE.anchorMonday=am; if(aw>=1&&aw<=CYCLE) STATE.anchorWeek=aw; if(pm) STATE.meeting.psalm.anchorMonday=pm; if(ps>=1) STATE.meeting.psalm.start=ps;
  markDirty(null); setBox.classList.remove("on"); render();
});

/* ---------- 원격 데이터 (db) ---------- */
function applyRemoteMeta(m){
  if(!m) return;
  ["rev","updated","updatedAt","anchorMonday","anchorWeek","meeting","commonPrayer"].forEach(function(k){ if(m[k]!==undefined) STATE[k]=m[k]; });
  if(m.dayIndex) m.dayIndex.forEach(function(x){ var d=dayByNo(x.no); if(d){ d.title=x.title; d.sub=x.sub; if(x.accent) d.accent=x.accent; } });
}
function applyRemoteDay(no,body){ var i=STATE.days.findIndex(function(d){return d.no===no;}); if(i<0) STATE.days.push(body); else STATE.days[i]=body; }
var ART_URL="https://claude.ai/code/artifact/0e7f770a-7850-4525-8bda-6643c06d54f1";
function showBanner(msg){
  var b=document.getElementById("banner");
  b.innerHTML=(msg||'<b>이 화면에서는 저장할 수 없습니다.</b><br>편집은 claude.ai 안에서 열었을 때만 됩니다. 브라우저(크롬 등)에서 아래 주소를 열고, 처음에 뜨는 <b>데이터 접근 허용</b>을 눌러 주세요.<br><code>'+ART_URL+'</code><br>상태: <span id="bstat"></span>')+
    '<div style="margin-top:8px"><button class="btn g" type="button" id="bclose">닫기</button></div>';
  var bs=b.querySelector("#bstat"); if(bs) bs.textContent=document.getElementById("status").textContent;
  b.classList.add("on"); b.querySelector("#bclose").onclick=function(){ b.classList.remove("on"); };
}
async function connect(){
  setStatus("저장소 연결 중…","busy");
  var use=window.claude&&window.claude.use;
  if(!use){ MODE="viewer"; setStatus("",""); document.getElementById("editBtn").hidden=true; document.getElementById("setBtn").hidden=true; render(); return; }
  MODE="artifact";
  try{ DB=await window.claude.use("db"); }catch(e){ DB=null; }
  if(!DB){ setStatus("저장 불가 — 편집 버튼을 눌러 안내 보기","err"); render(); return; }
  MODE="editor";
  try{
    var ms=await DB.doc("prayer/meta").get();
    if(ms.exists){ applyRemoteMeta(ms.data());
      var q=await DB.collection("prayer/meta/days").get();
      q.docs.forEach(function(s){ var b=s.data(); if(b&&b.no) applyRemoteDay(b.no,b); });
      STATE.days.sort(function(a,b){return a.no-b.no;});
      setStatus("동기화됨","");
    } else {
      // 저장소가 비어 있으면 현재 내용을 처음 기록합니다
      await DB.doc("prayer/meta").set(metaDoc());
      for(var i=0;i<STATE.days.length;i++) await DB.doc("prayer/meta/days/"+STATE.days[i].no).set(STATE.days[i]);
      setStatus("처음 저장됨","");
    }
  }catch(e){ var code=(e&&(e.code||e.message))||"unknown"; setStatus("동기화 실패: "+code,"err"); if(code==="not_granted") showBanner('<b>데이터 접근이 허용되지 않았습니다.</b><br>페이지를 새로고침한 뒤 뜨는 <b>데이터 접근 허용</b>을 눌러 주세요. (허용 안 함을 눌렀다면 새로고침하면 다시 물어봅니다)'); }
  render();
  // 실시간 반영: 다른 기기의 저장을 받아옵니다 (편집 중인 화면은 건드리지 않음)
  DB.doc("prayer/meta").onSnapshot(function(s){ var m=s.data(); if(!m||m.rev===STATE.rev) return; if(editingKey||document.querySelector(".ed")) return; applyRemoteMeta(m); render(); setStatus("다른 기기에서 갱신됨",""); });
  DB.collection("prayer/meta/days").onSnapshot(function(q){ if(document.querySelector(".ed")) return; var ch=false; q.docChanges().forEach(function(c){ if(c.type==="removed") return; var b=c.doc.data(); if(b&&b.no){ if(JSON.stringify(dayByNo(b.no))!==JSON.stringify(b)){ applyRemoteDay(b.no,b); ch=true; } } }); if(ch){ STATE.days.sort(function(a,b){return a.no-b.no;}); render(); } });
}

var h=/^#day([0-7])$/.exec(location.hash); SEL=h?+h[1]:todayWeek();
render(); connect();
})();
</script>
