function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
var enc=b64(DATA), iv=b64(IV), salt=b64(SALT);
var f=document.getElementById("f"), pw=document.getElementById("pw"), err=document.getElementById("err"),
    go=document.getElementById("go"), rem=document.getElementById("rem");
function show(html){ document.open(); document.write(html); document.close(); }
async function keyFrom(pass){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},base,
    {name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,enc);
  return new TextDecoder().decode(plain);
}
async function tryRemembered(){
  try{
    var jwk=JSON.parse(localStorage.getItem(KS)||"null"); if(!jwk) return false;
    var key=await crypto.subtle.importKey("jwk",jwk,{name:"AES-GCM"},true,["decrypt"]);
    show(await open(key)); return true;
  }catch(e){ try{localStorage.removeItem(KS);}catch(_){} return false; }
}
f.addEventListener("submit",async function(e){
  e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="확인 중…";
  try{
    var key=await keyFrom(pw.value.trim());
    var html=await open(key);
    if(rem.checked){ try{ localStorage.setItem(KS, JSON.stringify(await crypto.subtle.exportKey("jwk",key))); }catch(_){} }
    show(html);
  }catch(ex){
    err.textContent="비밀번호가 맞지 않습니다."; pw.value=""; pw.focus();
    go.disabled=false; go.textContent="열기";
  }
});
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
tryRemembered();
})();
